<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Callit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--bg2:#F5F3FF;--hover:#EFECFF;--line:#E3E0F4;--text:#1A1150;--muted:#6B6598;
  --accent:#2A1B8C;--on-accent:#FFFFFF;--indigo:#4B37E0;--up:#0B9366;--down:#D92D55;
  --display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --body:'Schibsted Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --hdr:64px;color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#130D3A;--bg2:#1B1350;--hover:#221961;--line:#2C2370;--text:#FFFFFF;--muted:#A9A3D6;--accent:#FFFFFF;--on-accent:#1A1150;--indigo:#8B7DFF;--up:#3DDC97;--down:#FF6B8A;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#130D3A;--bg2:#1B1350;--hover:#221961;--line:#2C2370;--text:#FFFFFF;--muted:#A9A3D6;--accent:#FFFFFF;--on-accent:#1A1150;--indigo:#8B7DFF;--up:#3DDC97;--down:#FF6B8A;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
svg{flex:none}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--muted)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:auto minmax(0,1fr)}
.sb{position:sticky;top:0;height:100vh;width:268px;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 14px;overflow-y:auto;background:var(--bg)}
.sb-top{display:flex;align-items:center;gap:10px;padding:2px 4px 14px}
.brand{display:flex;align-items:center;gap:10px;font:800 25px/1 var(--display);letter-spacing:-.03em}
.mark{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.ib{width:38px;height:38px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--text);position:relative}
.ib:hover{background:var(--hover)}
.sb-top .ib:first-of-type{margin-left:auto}
.searchbtn{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);border-radius:999px;padding:10px 14px;color:var(--muted);background:var(--bg2);margin-bottom:6px;text-align:left}
.grp{font-size:13px;color:var(--muted);padding:14px 12px 4px;border-top:1px solid var(--line);margin-top:8px}
.grp.first{border-top:0;margin-top:0}
.nav a{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:999px;font-size:16px;font-weight:500}
.nav a:hover{background:var(--hover)}
.nav a.on{font-weight:800}
.nav a.on svg{color:var(--indigo)}
.sb .grow{flex:1;min-height:16px}
.connect{width:100%}
.acct{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:8px;border-radius:999px;text-align:left}
.acct:hover{background:var(--hover)}
@media (min-width:761px){
  body.collapsed .sb{width:80px;padding:16px 10px;align-items:center}
  body.collapsed .lbl,body.collapsed .brand span,body.collapsed .sb-top .settings{display:none}
  body.collapsed .sb-top{flex-direction:column;padding:2px 0 10px}
  body.collapsed .sb-top .ib:first-of-type{margin-left:0}
  body.collapsed .sb-top .collapse svg{transform:rotate(180deg)}
  body.collapsed .searchbtn{width:48px;height:48px;padding:0;justify-content:center;border-radius:50%}
  body.collapsed .grp{font-size:0;padding:6px 0;width:40px;margin-top:8px}
  body.collapsed .grp.first{display:none}
  body.collapsed .nav a{justify-content:center;padding:12px}
  body.collapsed .connect{width:48px;height:48px;padding:0;border-radius:50%}
  body.collapsed .acct{justify-content:center;padding:4px}
}
.main{min-width:0}
.hdr{position:sticky;top:0;z-index:15;height:var(--hdr);display:flex;align-items:center;gap:12px;padding:0 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hdr h1{font:800 22px/1 var(--display);letter-spacing:-.02em;margin:0}
.hdr .menu{display:none}
.pill{margin-left:auto;display:flex;align-items:center;gap:2px;border:1.5px solid var(--line);border-radius:999px;padding:3px}
.pill .ib{width:40px;height:40px}
.dotn{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--down);border:2px solid var(--bg)}
.cols{display:grid;grid-template-columns:minmax(0,640px) 330px;gap:28px;padding:0 20px 0 0}
.center{border-right:1px solid var(--line);min-height:calc(100vh - var(--hdr));padding-bottom:120px}
.rail{position:sticky;top:var(--hdr);align-self:start;padding:18px 0;display:flex;flex-direction:column;gap:16px}
@media (max-width:1279px){.cols{grid-template-columns:minmax(0,680px);padding:0}.rail{display:none}}
.fab{position:fixed;right:28px;bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:25;width:62px;height:62px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 10px 30px rgba(19,13,58,.35)}
.fab:hover{transform:scale(1.05)}
.bnav,.dscrim{display:none}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .sb{position:fixed;left:0;top:0;bottom:0;z-index:45;width:290px;transform:translateX(-102%);transition:transform .22s ease;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  body.drawer .sb{transform:none}
  body.drawer .dscrim{display:block;position:fixed;inset:0;z-index:44;background:rgba(10,7,30,.55)}
  .hdr{padding:0 12px}
  .hdr .menu{display:grid}
  .hdr h1{font-size:20px}
  .center{border-right:0}
  .fab{bottom:calc(92px + env(safe-area-inset-bottom,0px));right:18px;width:56px;height:56px}
  .bnav{display:flex;gap:10px;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30}
  .bnav .bar{flex:1;display:flex;justify-content:space-around;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:999px;height:64px;box-shadow:0 8px 24px rgba(19,13,58,.25)}
  .bnav a,.bnav button{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;color:var(--muted);border:0;background:transparent}
  .bnav a.on{color:var(--text);background:var(--hover)}
  .bnav .sq{width:64px;height:64px;background:var(--bg2);border:1px solid var(--line);color:var(--text);box-shadow:0 8px 24px rgba(19,13,58,.25)}
}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:10px 18px;font-weight:700;background:var(--bg2);color:var(--text);white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.block{width:100%}
.btn.sm{padding:6px 14px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.input{width:100%;background:var(--bg2);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
.input:focus{border-color:var(--indigo)}
textarea.input{resize:vertical;min-height:96px}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:12.5px;color:var(--down);min-height:4px}
.seg{display:inline-flex;background:var(--bg2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:18px}
.card h3{margin:0 0 12px;font:800 18px/1.2 var(--display)}
.pad{padding:18px 16px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:none}
.av.md{width:46px;height:46px;font-size:15px}
.av.lg{width:96px;height:96px;font-size:30px;border:4px solid var(--bg)}
.tokav{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff;flex:none}
.chain{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--hover);color:var(--indigo)}
.h2{font:800 20px/1.2 var(--display);margin:0}

/* ---------- tabs + feed ---------- */
.tabs{position:sticky;top:var(--hdr);z-index:12;display:flex;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:16px 0;font-weight:600;font-size:15.5px;color:var(--muted);position:relative}
.tabs button:hover{background:var(--hover)}
.tabs button.on{color:var(--text);font-weight:800}
.tabs button.on::after{content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:60px;height:4px;border-radius:4px;background:var(--indigo)}
.newpill{position:sticky;top:calc(var(--hdr) + 62px);z-index:11;display:flex;justify-content:center;height:0}
.newpill button{margin-top:10px;display:flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--indigo);color:#fff;font-weight:700;padding:7px 16px 7px 10px;box-shadow:0 8px 20px rgba(19,13,58,.3);animation:drop .3s ease-out}
.newpill .av{width:26px;height:26px;font-size:10px;border:2px solid var(--indigo)}
@keyframes drop{from{transform:translateY(-10px);opacity:0}}
.post{display:grid;grid-template-columns:46px minmax(0,1fr);gap:12px;padding:16px 16px 8px;border-bottom:1px solid var(--line)}
.post:hover{background:color-mix(in srgb,var(--hover) 40%,transparent)}
.post.fresh{animation:flash 1.6s ease-out}
@keyframes flash{from{background:var(--hover)}}
.phead{display:flex;align-items:center;gap:6px;min-width:0}
.pname{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pname:hover{text-decoration:underline}
.rk{font-size:12px;font-weight:800;color:var(--indigo);background:var(--hover);padding:1px 7px;border-radius:999px}
.tag{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--accent);color:var(--on-accent)}
.phead time{margin-left:auto;color:var(--muted);font-size:14px;white-space:nowrap}
.ptext{margin:3px 0 10px;font-size:15.5px;overflow-wrap:anywhere}
.ccard{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1.5px solid var(--line);border-radius:18px;padding:12px 14px}
.ccard:hover{border-color:var(--indigo)}
.post.fresh .ccard{animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.94);opacity:.3}}
.cn{flex:1;min-width:0}
.cn b{display:block;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cn span{font-size:13px;color:var(--muted)}
.cr{text-align:right}
.cr b{display:block;font:800 21px/1.1 var(--display);letter-spacing:-.01em}
.cr span{font-size:12.5px;color:var(--muted)}
.pnote{font-size:13px;color:var(--muted);margin-top:8px}
.pbar{display:flex;align-items:center;gap:8px;margin:6px 0 0 -8px}
.pbar .icons{display:flex;flex:1;justify-content:space-between;max-width:380px}
.act{display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;color:var(--muted);padding:7px 8px;border-radius:999px;font-size:13.5px;font-weight:600}
.act:hover{background:var(--hover);color:var(--indigo)}
.act.liked{color:var(--down)}.act.reposted{color:var(--up)}
.pbar .btn{margin-left:auto}
.pbar .icons{min-width:0}
@media (max-width:520px){.post{grid-template-columns:40px minmax(0,1fr);gap:10px;padding:14px 12px 6px}.post .av.md{width:40px;height:40px;font-size:13px}.act{padding:6px 4px;font-size:12.5px;gap:4px}.act.views{display:none}.cr b{font-size:19px}}
.empty{text-align:center;padding:48px 24px}
.empty p{color:var(--muted);max-width:360px;margin:8px auto 18px}
.sugg{display:flex;align-items:center;gap:12px;padding:12px 0}
.sugg .grow{flex:1;min-width:0}

/* ---------- pages ---------- */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .r{text-align:right}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);font-size:14.5px}
th{font-size:12.5px;color:var(--muted);font-weight:600}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--hover)}
td.rkc{font:800 18px var(--display);width:48px}
.person{display:flex;align-items:center;gap:10px;font-weight:700}
.swap .box{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.card .swap .box{background:var(--bg)}
.swap .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.swap .amt{border:0;background:transparent;font:800 26px/1.2 var(--display);width:100%;min-width:0;outline:none}
.swap select{border:1.5px solid var(--line);background:var(--bg2);border-radius:999px;padding:6px 10px;font-weight:700}
.swap .flip{display:grid;place-items:center;margin:-10px auto;position:relative;z-index:1;width:38px;height:38px;border-radius:50%;border:4px solid var(--bg2);background:var(--accent);color:var(--on-accent)}
.swap .lines{font-size:13px;color:var(--muted);margin:14px 0;display:flex;flex-direction:column;gap:4px}
.swap .lines div{display:flex;justify-content:space-between}
.chart{width:100%;height:200px;display:block}
.chart .line{fill:none;stroke-width:2.2;vector-effect:non-scaling-stroke}
.chart .line.up{stroke:var(--up)}.chart .line.down{stroke:var(--down)}
.chart .area.up{fill:var(--up);opacity:.1}.chart .area.down{fill:var(--down);opacity:.1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:14px 0}
.stats div{background:var(--bg);padding:12px}
.stats span{display:block;font-size:12.5px;color:var(--muted)}
.stats b{font-size:16px}
.copyca{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);background:var(--bg2);border:0;border-radius:999px;padding:5px 10px}
.price{font:800 32px/1 var(--display)}
.banner{height:150px;background:var(--bg2);border-bottom:1px solid var(--line);background-image:radial-gradient(var(--line) 1.2px,transparent 1.2px);background-size:16px 16px}
.phero{padding:0 16px}
.phero .top{display:flex;justify-content:space-between;align-items:flex-end;margin-top:-48px}
.pstats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:16px 0}
.pstats div{background:var(--bg);padding:12px}
.pstats span{display:block;font-size:12.5px;color:var(--muted)}
.pstats b{font:800 19px var(--display)}
@media (max-width:520px){.pstats{grid-template-columns:repeat(2,1fr)}}
.bal{font:800 42px/1 var(--display);letter-spacing:-.02em}
.acts3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 6px}
.pkgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.pkg{border:1.5px solid var(--line);border-radius:14px;padding:14px;background:var(--bg)}
.pkg.on{border-color:var(--indigo);box-shadow:0 0 0 3px color-mix(in srgb,var(--indigo) 22%,transparent)}
.pkg b{display:block;margin-bottom:4px}
.pkg p{margin:0;font-size:13px;color:var(--muted)}
.soon{padding:56px 24px;text-align:center}
.soon .mark{margin:0 auto 16px;width:56px;height:56px;border-radius:16px}
.soon p{color:var(--muted);max-width:400px;margin:8px auto 0}
.prose{padding:20px 16px;max-width:580px}
.prose p{margin:0 0 14px}

/* ---------- modal + toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,7,30,.6);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--bg);border:1px solid var(--line);border-radius:22px;width:min(470px,100%);max-height:calc(100% - 20px);overflow:auto;padding:22px;animation:rise .18s ease-out}
.modal h2{font:800 22px/1.1 var(--display);margin:0 0 4px}
.modal .sub{color:var(--muted);margin:0 0 18px;font-size:14px}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg2);margin-bottom:8px;font-weight:700;text-align:left}
.opt:hover{border-color:var(--indigo)}
.opt .tokav{width:30px;height:30px;border-radius:50%}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;margin:14px 0 10px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}
.preview{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px dashed var(--indigo);border-radius:16px;margin-bottom:14px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--indigo);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <aside class="sb" id="sb" aria-label="Main navigation">
    <div class="sb-top">
      <a class="brand" href="#/home"><span class="mark" id="markIcon"></span><span>Callit</span></a>
      <button class="ib settings" data-act="settings" aria-label="Settings" id="setIcon"></button>
      <button class="ib collapse" data-act="collapse" aria-label="Collapse sidebar" id="colIcon"></button>
    </div>
    <button class="searchbtn" data-act="search" id="searchBtn"></button>
    <div class="grp first lbl-grp">Features</div>
    <nav class="nav" id="navA"></nav>
    <div class="grp">Products</div>
    <nav class="nav" id="navB"></nav>
    <div class="grow"></div>
    <div id="acct"></div>
  </aside>
  <div class="main">
    <header class="hdr">
      <button class="ib menu" data-act="drawer" aria-label="Open menu" id="menuIcon"></button>
      <h1 id="title">Home</h1>
      <div class="pill" id="pill"></div>
    </header>
    <div class="cols"><section class="center" id="view"></section><aside class="rail" id="rail"></aside></div>
  </div>
</div>
<div class="dscrim" data-act="drawer"></div>
<button class="fab" data-act="newcall" aria-label="Make a call" id="fab"></button>
<nav class="bnav" id="bnav"></nav>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rng(seed){let s=(seed*2654435761)>>>0||1;return()=>(s=(s*1664525+1013904223)>>>0)/4294967296}
const fmtUsd=n=>n>=1e9?'$'+(n/1e9).toFixed(2)+'B':n>=1e6?'$'+(n/1e6).toFixed(2)+'M':n>=1e3?'$'+(n/1e3).toFixed(n<1e4?1:0)+'K':'$'+n.toFixed(2);

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}

const perf=k=>{const t=T[k.t];return t.prelaunch?null:(mcap(t)/k.entry-1)*100};
function chart(seed,up,w=600,h=190){const r=rng(seed);let y=up?.25:.75,p=[];for(let i=0;i<72;i++){y+=(r()-.5)*.11+(up?.008:-.008);y=Math.min(.95,Math.max(.05,y));p.push(y)}
 const d=p.map((v,i)=>`${i?'L':'M'}${(i/71*w).toFixed(1)},${(h-v*h).toFixed(1)}`).join('');
 return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="chart" role="img" aria-label="Price chart"><path d="${d}L${w},${h}L0,${h}Z" class="area ${up?'up':'down'}"/><path d="${d}" class="line ${up?'up':'down'}"/></svg>`}
function qr(seed){const r=rng(seed),n=21,c=9;let o='';const f=(x,y)=>(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){const on=f(x,y)?((x%14===0||x%14===6||y%14===0||y%14===6)||(x%14>1&&x%14<5&&y%14>1&&y%14<5)):r()>.5;if(on)o+=`<rect x="${x*c}" y="${y*c}" width="${c}" height="${c}"/>`}
 return `<svg viewBox="0 0 ${n*c} ${n*c}" width="180" height="180" style="background:#fff;padding:10px;border-radius:14px" fill="#130D3A">${o}</svg>`}

 <div id="feed" style="border-top:1px solid var(--line);margin-top:10px">${on.map(post).join('')||'<div class="empty"><b>No calls yet</b><p>Call it first and your entry gets stamped at today’s market cap.</p></div>'}</div>`}

function vLeaders(){return `<div class="pad" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span class="muted">Ranked by win rate. Minimum 10 calls. Sponsored calls don't count.</span>
 <div class="seg">${['7d','30d','All time'].map(x=>`<button class="${S.lb===x?'on':''}" data-act="lb" data-f="${x}">${x}</button>`).join('')}</div></div>
 <div class="tablewrap" style="border-top:1px solid var(--line)"><table><thead><tr><th>Rank</th><th>Caller</th><th>Win rate</th><th>Avg return</th><th>Calls</th><th>Best call</th><th></th></tr></thead><tbody>
 ${ranked().map((c,i)=>`<tr data-go="#/profile/${c.h}"><td class="rkc">${i+1}</td><td><div class="person">${avatar(c.h)}${c.h}</div></td><td class="num">${c.win}%</td><td class="num up">${fmtPct(c.avg)}</td><td class="num">${c.calls}</td><td class="num up">${fmtPct(c.best)}</td>
 <td><button class="btn sm ${S.following.has(c.h)?'ghost':'primary'}" data-act="follow" data-h="${c.h}">${S.following.has(c.h)?'Following':'Follow'}</button></td></tr>`).join('')}</tbody></table></div>
 <p class="hint pad">A call wins if it hits its target, or is up at least 50% when its time window closes.</p>`}

function vWallet(){if(!S.connected)return `<div class="empty"><b class="h2">No wallet connected</b><p>Sign in with email, Google or X and we create a wallet for you. Or connect Phantom, Solflare or Backpack. You always hold your own keys.</p><button class="btn primary" data-act="connect">Connect wallet</button></div>`;
 const rows=Object.entries(S.bal).filter(([,a])=>a>0),tot=rows.reduce((s,[k,a])=>s+usd(k,a),0);
 return `<div class="pad"><div class="muted">Total balance</div><div class="bal num">${fmtUsd(tot)}</div>
 <button class="copyca" style="margin-top:10px" data-act="copy" data-v="${S.addr}">${short(S.addr)} ${ic('copy',13)}</button>
 <div class="acts3"><button class="btn" data-act="send">Send</button><button class="btn" data-act="receive">Receive</button><a class="btn primary" href="#/swap">Swap</a></div>
 <div class="list">${rows.map(([k,a])=>`<a class="li" href="#/token/${k}">${tokav(k)}<div class="grow"><b>${T[k].name}</b><div class="hint num">${fmtAmt(a)} ${k}</div></div><div class="r num"><b>${fmtUsd(usd(k,a))}</b><div class="hint ${T[k].chg>=0?'up':'down'}">${fmtPct(T[k].chg)}</div></div></a>`).join('')}</div>
 <b class="h2" style="display:block;margin:22px 0 4px">Activity</b><div class="list">${S.activity.map(a=>`<div class="li"><div class="grow"><b>${a.k}</b><div class="hint">${a.t}</div></div><div class="r num">${esc(a.d)}</div></div>`).join('')}</div></div>`}

function vProfile(h){if(!h&&S.connected)h=S.me;const c=C[h];
 if(!c)return `<div class="empty"><b class="h2">Your profile</b><p>Connect a wallet to create your caller profile and start building a track record.</p><button class="btn primary" data-act="connect">Connect wallet</button></div>`;
 const mine=calls.filter(k=>k.c===h),me=h===S.me,r=rankOf(h),f=S.following.has(h);
 return `<div class="banner"></div><div class="phero"><div class="top">${avatar(h,'lg')}${me?'<button class="btn ghost sm" data-act="settings">Edit profile</button>':`<button class="btn sm ${f?'ghost':'primary'}" data-act="follow" data-h="${h}">${f?'Following':'Follow'}</button>`}</div>
 <b class="h2" style="display:block;margin-top:10px">${esc(h)}</b><div class="muted">@${esc(h)}</div>
 <p class="muted" style="margin:8px 0 0">${r?`Ranked #${r}`:'Not ranked yet. 10 calls to qualify.'} <b style="color:var(--text)">${fmtK(c.followers+(f?1:0))}</b> followers</p>
 <div class="pstats num"><div><span>Win rate</span><b>${c.calls?c.win+'%':'—'}</b></div><div><span>Avg return</span><b>${c.calls?fmtPct(c.avg):'—'}</b></div><div><span>Calls</span><b>${c.calls}</b></div><div><span>Best call</span><b>${c.best?fmtPct(c.best):'—'}</b></div></div></div>
 <div class="tabs" style="position:static"><button class="on">Calls</button></div>
 <div id="feed">${mine.map(post).join('')||`<div class="empty"><b>No calls yet</b>${me?'<p>Your calls and their performance show up here.</p><button class="btn primary" data-act="newcall">Make a call</button>':''}</div>`}</div>`}

function vPromote(){const PK={boost:['Feed boost','Pinned in For you for 24 hours.'],spotlight:['Caller spotlight','One top-10 caller covers your project.'],launch:['Launch push','Three top callers cover your launch day.']};
 return `<div class="pad"><p class="muted" style="margin:0 0 16px;max-width:560px">Announce a launch or product on any chain. Promotions are labelled sponsored and never count toward a caller's ranking.</p>
 <div class="field"><label for="pn">Project name</label><input id="pn" class="input" placeholder="e.g. Nebula"></div>
 <div class="field"><label for="pc">Chain</label><select id="pc" class="input">${['Solana','Base','Ethereum','BNB Chain','Arbitrum','Other'].map(x=>`<option>${x}</option>`).join('')}</select></div>
 <div class="field"><label for="pl">Contract address or website</label><input id="pl" class="input" placeholder="Paste a CA or https://"></div>
 <div class="field"><label for="pd">Launch date (optional)</label><input id="pd" type="date" class="input"></div>
 <div class="field"><label for="pp">What should people know?</label><textarea id="pp" class="input" maxlength="400" placeholder="What it does, why now, where to follow"></textarea></div>
 <div class="field"><label>Package</label><div class="pkgs">${Object.entries(PK).map(([k,[a,b]])=>`<button class="pkg ${S.pkg===k?'on':''}" data-act="pkg" data-f="${k}" style="text-align:left"><b>${a}</b><p>${b}</p><p style="margin-top:8px">Pricing set before launch</p></button>`).join('')}</div></div>
 <div id="perr" class="err"></div><button class="btn primary" data-act="submitpromo">Send promotion request</button></div>`}

function vAbout(){return `<div class="prose"><b class="h2" style="display:block;margin-bottom:12px">Call it early. Get paid for being right.</b>
 <p>Callit is where crypto calls get tracked. Every call is stamped with the market cap at the moment it's posted, then followed live, so a caller's record is public and can't be edited.</p>
 <p>Callers earn a share of fees when people trade through their calls. Projects on any chain can promote launches through top callers, always labelled as sponsored.</p>
 <p>Wallets are non-custodial. Sign in with email, Google or X, or bring Phantom, Solflare or Backpack.</p></div>`}

/* ---------- rail ---------- */
function rail(){const trend=Object.values(T).filter(t=>!t.base&&!t.prelaunch).sort((a,b)=>b.chg-a.chg).slice(0,4);
 return `<div class="card"><h3>Trending</h3><div class="list">${trend.map(t=>`<a class="li" href="#/token/${t.sym}">${tokav(t.sym)}<div class="grow"><b>$${t.sym}</b><div class="hint">${(n=>n+(n===1?' call':' calls'))(calls.filter(k=>k.t===t.sym).length)}</div></div><div class="r num"><b>${fmtUsd(mcap(t))}</b><div class="hint ${t.chg>=0?'up':'down'}">${fmtPct(t.chg)}</div></div></a>`).join('')}</div></div>
 <div class="card"><h3>Top callers</h3><div class="list">${ranked().slice(0,4).map(c=>`<div class="li">${avatar(c.h)}<div class="grow"><a class="pname" href="#/profile/${c.h}">${c.h}</a><div class="hint">${c.win}% win rate</div></div><button class="btn sm ${S.following.has(c.h)?'ghost':'primary'}" data-act="follow" data-h="${c.h}">${S.following.has(c.h)?'Following':'Follow'}</button></div>`).join('')}</div>
 <a class="btn ghost block" style="margin-top:10px" href="#/leaderboard">See leaderboard</a></div>`}

/* ---------- chrome ---------- */
const NAV_A=[['home','Home'],['market','Market'],['trenches','Trenches'],['swap','Swap'],['stake','Stake'],['wallet','Wallet'],['profile','Profile']];
const NAV_B=[['messages','Messages'],['news','News'],['promote','Promote'],['about','About'],['leaderboard','Leaderboard']];
const TITLES=Object.fromEntries([...NAV_A,...NAV_B,['token','Token']]);
function chrome(route){const link=([k,l])=>`<a href="#/${k}" class="${route===k?'on':''}" title="${l}">${ic(k)}<span class="lbl">${l}</span></a>`;
 $('#navA').innerHTML=NAV_A.map(link).join('');$('#navB').innerHTML=NAV_B.map(link).join('');
 $('#acct').innerHTML=S.connected?`<button class="acct" data-act="disconnect" title="Disconnect">${avatar(S.me)}<span class="lbl" style="min-width:0"><b style="display:block">${esc(S.me)}</b><span class="hint num">${short(S.addr)}</span></span></button>`
  :`<button class="btn primary connect" data-act="connect" title="Connect wallet">${ic('wallet',20)}<span class="lbl">Connect wallet</span></button>`;
 $('#pill').innerHTML=`<button class="ib" data-act="me" aria-label="Profile">${S.connected?avatar(S.me).replace('class="av ','class="av " style="width:32px;height:32px;font-size:11px;'):ic('profile')}</button>
  <button class="ib" data-act="notifs" aria-label="Notifications">${ic('bell')}${S.unread?'<span class="dotn"></span>':''}</button>
  <button class="ib" data-act="theme" aria-label="Switch theme">${ic('sun')}</button>`;
 $('#bnav').innerHTML=`<div class="bar">${[['home','Home'],['market','Market'],['leaderboard','Leaderboard'],['wallet','Wallet']].map(([k,l])=>`<a href="#/${k}" class="${route===k?'on':''}" aria-label="${l}">${ic(k,24)}</a>`).join('')}</div><button class="sq" data-act="search" aria-label="Search" style="display:grid;place-items:center;border-radius:50%">${ic('search',24)}</button>`;
 $('#title').textContent=TITLES[route]||'Home'}

function render(){document.body.classList.remove('drawer');const [,r0='home',p]=location.hash.split('/');const r=r0||'home';let html;
 if(r==='token'){const t=T[p];if(t&&tradable(t)&&p!==S.swap.from)S.swap.to=p;html=vToken(p)}
 else html=({market:vMarket,trenches:vTrenches,swap:vSwap,wallet:vWallet,profile:()=>vProfile(p),leaderboard:vLeaders,promote:vPromote,about:vAbout,
  stake:()=>soon('Staking opens with $CALLIT','Stake $CALLIT to unlock premium calls and discounted project promotions. Launching after the product is live on mainnet.'),
  messages:()=>soon('Messages are coming','Direct messages and token chat rooms arrive in the chat phase.'),
  news:()=>soon('News is coming','Launch announcements, listings and market news in one place.')}[r]||vHome)();
 $('#view').innerHTML=html;$('#rail').innerHTML=rail();chrome(r);renderSwaps()}

/* ---------- modals ---------- */
function modal(title,sub,body,onMount){$('#modal').innerHTML=`<div class="scrim" data-act="close"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="mhead"><div><h2>${title}</h2>${sub?`<p class="sub">${sub}</p>`:''}</div><button class="ib" data-act="close" aria-label="Close">${ic('x',18)}</button></div>${body}</div></div>`;
 onMount&&onMount($('#modal .modal'));const f=$('#modal input,#modal textarea');f&&f.focus()}
const closeModal=()=>$('#modal').innerHTML='';

function connectModal(next){modal('Sign in to Callit','New here? We create a Solana wallet for you. You own the keys.',
 `${['Email','Google','X'].map(l=>`<button class="opt" data-connect="${l}"><span class="tokav" style="background:var(--indigo)">${l[0]}</span>Continue with ${l}</button>`).join('')}
 <div class="divider">or use your own wallet</div>${['Phantom','Solflare','Backpack'].map(w=>`<button class="opt" data-connect="${w}">${tokav(w)}${w}</button>`).join('')}`,
 m=>m.addEventListener('click',e=>{const b=e.target.closest('[data-connect]');if(!b)return;
  S.connected=true;S.addr='CaLL'+Math.random().toString(36).slice(2,10)+'x9Qp2HkWm4Tz7VbN1sRdE3';S.me='caller_'+S.addr.slice(4,8);
  C[S.me]={h:S.me,win:0,avg:0,calls:0,best:0,followers:0};closeModal();
  toast(['Phantom','Solflare','Backpack'].includes(b.dataset.connect)?`${b.dataset.connect} connected`:'Wallet created');render();next&&next()}))}

function callModal(pre){if(!S.connected)return connectModal(()=>callModal(pre));
 modal('Make a call','Your entry is stamped automatically at the live market cap when you post.',
 `<div class="field"><label for="ct">Token</label><input id="ct" class="input" placeholder="Paste a contract address or ticker" value="${pre?'$'+pre:''}"></div><div id="cprev"></div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="field"><label for="cg">Target market cap</label><input id="cg" class="input num" inputmode="decimal" placeholder="e.g. 5M"></div>
 <div class="field"><label for="ch">Time window</label><select id="ch" class="input">${['24 hours','3 days','7 days','30 days'].map(x=>`<option ${x==='7 days'?'selected':''}>${x}</option>`).join('')}</select></div></div>
 <div class="field"><label for="cx">Why this token?</label><textarea id="cx" class="input" maxlength="280" placeholder="Your thesis. What do you see that others don't?"></textarea><span class="hint" id="cn">0 / 280</span></div>
 <div class="err" id="cerr"></div><button class="btn primary block" id="cpost" disabled>Post call</button>`,
 m=>{let tok=null;const inp=$('#ct',m),tx=$('#cx',m),post=$('#cpost',m);
  const check=()=>{$('#cn',m).textContent=tx.value.length+' / 280';post.disabled=!(tok&&!tok.prelaunch&&tx.value.trim().length>=10)};
  const find=()=>{const v=inp.value.trim().replace(/^\$/,'').toUpperCase();tok=Object.values(T).find(t=>!t.base&&(t.sym===v||t.ca.toUpperCase()===v))||null;
   $('#cprev',m).innerHTML=tok?`<div class="preview">${tokav(tok.sym)}<div style="flex:1"><b>${esc(tok.name)} $${tok.sym}</b> <span class="chain">${tok.chain}</span><div class="hint num">${tok.prelaunch?'Launches '+esc(tok.prelaunch)+'. Calls open at launch.':'Entry would be '+fmtUsd(mcap(tok))+' MC'}</div></div></div>`:(v?'<p class="hint" style="margin-top:-6px">No token found. Try GLORP, DOTB, MOTH, KFSH or ORBIT in this prototype.</p>':'');check()};
  inp.addEventListener('input',find);tx.addEventListener('input',check);find();
  post.addEventListener('click',()=>{const g=$('#cg',m).value.trim().toUpperCase(),n=parseFloat(g)*(g.endsWith('B')?1e9:g.endsWith('M')?1e6:g.endsWith('K')?1e3:1);
   if(g&&!(n>mcap(tok))){$('#cerr',m).textContent='Target must be above the current market cap of '+fmtUsd(mcap(tok))+'.';return}
   calls.forEach(k=>k.fresh=false);calls.unshift({id:Date.now(),c:S.me,t:tok.sym,entry:mcap(tok),thesis:tx.value.trim(),target:n||null,horizon:$('#ch',m).value,ago:'now',likes:0,reposts:0,replies:0,views:1,fresh:true});
   C[S.me].calls++;closeModal();S.tab='foryou';if(location.hash!=='#/home')location.hash='#/home';else render();toast('Call posted');scrollTo({top:0})})})}

function searchModal(){modal('Search','',`<input class="input" id="sq" placeholder="Search tokens, tickers or callers"><div class="list" id="sres" style="margin-top:8px"></div>`,
 m=>{const run=()=>{const q=$('#sq',m).value.trim().toLowerCase().replace(/^[$@]/,'');
  const toks=Object.values(T).filter(t=>!t.base&&(!q||t.sym.toLowerCase().includes(q)||t.name.toLowerCase().includes(q))).slice(0,5);
  const ppl=Object.values(C).filter(c=>!q||c.h.includes(q)).slice(0,4);
  $('#sres',m).innerHTML=toks.map(t=>`<a class="li" href="#/token/${t.sym}" data-act="close">${tokav(t.sym)}<div class="grow"><b>${esc(t.name)}</b><div class="hint">$${t.sym} on ${t.chain}</div></div></a>`).join('')+ppl.map(c=>`<a class="li" href="#/profile/${c.h}" data-act="close">${avatar(c.h)}<div class="grow"><b>${c.h}</b><div class="hint">${c.calls} calls, ${c.win}% win rate</div></div></a>`).join('')||'<p class="hint">Nothing matches that. Try a ticker like GLORP.</p>'};
  $('#sq',m).addEventListener('input',run);run()})}
function notifsModal(){S.unread=false;chrome(currentRoute());modal('Notifications','',`<div class="list">
 ${[['fadedpixel','posted a call on $GLORP','2h'],['lagosape','is promoting the Nebula launch','3h'],['minnie_sol','called $DOTB, now up big','4h']].map(([h,t,a])=>`<a class="li" href="#/profile/${h}" data-act="close">${avatar(h)}<div class="grow"><b>${h}</b> ${t}<div class="hint">${a} ago</div></div></a>`).join('')}</div>`)}
function settingsModal(){const th=document.documentElement.dataset.theme||'system',col=document.body.classList.contains('collapsed');
 modal('Settings','',`<div class="field"><label>Theme</label><div class="seg">${[['system','System'],['dark','Indigo'],['light','White']].map(([k,l])=>`<button class="${th===k?'on':''}" data-act="settheme" data-f="${k}">${l}</button>`).join('')}</div></div>
 <div class="field"><label>Sidebar</label><div class="seg"><button class="${col?'':'on'}" data-act="setside" data-f="open">Expanded</button><button class="${col?'on':''}" data-act="setside" data-f="closed">Icons only</button></div></div>`)}
function sendModal(){modal('Send','Send tokens to any Solana address.',
 `<div class="field"><label for="st">Token</label><select id="st" class="input">${Object.keys(S.bal).filter(k=>S.bal[k]>0).map(k=>`<option value="${k}">${k} (${fmtAmt(S.bal[k])})</option>`).join('')}</select></div>
 <div class="field"><label for="sa">Recipient address</label><input id="sa" class="input" placeholder="Solana address"></div>
 <div class="field"><label for="sv">Amount</label><div style="display:flex;gap:8px"><input id="sv" class="input num" inputmode="decimal" placeholder="0"><button class="btn" id="smax">Max</button></div></div>
 <div class="err" id="serr"></div><button class="btn primary block" id="sgo">Send</button>`,
 m=>{$('#smax',m).onclick=()=>$('#sv',m).value=S.bal[$('#st',m).value];
  $('#sgo',m).onclick=()=>{const k=$('#st',m).value,to=$('#sa',m).value.trim(),a=parseFloat($('#sv',m).value),e=$('#serr',m);
   if(!/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(to))return e.textContent='That isn’t a valid Solana address. Check it and try again.';
   if(!(a>0))return e.textContent='Enter an amount above zero.';
   if(a>S.bal[k])return e.textContent=`You only have ${fmtAmt(S.bal[k])} ${k}.`;
   S.bal[k]-=a;S.activity.unshift({k:'Sent',d:`${fmtAmt(a)} ${k} to ${short(to)}`,t:'Just now'});closeModal();render();toast('Sent')}})}
const receiveModal=()=>modal('Receive','Send SOL or any Solana token to this address.',`<div style="text-align:center">${qr(hue(S.addr))}<p class="num" style="overflow-wrap:anywhere;font-size:13px">${S.addr}</p><button class="btn primary block" data-act="copy" data-v="${S.addr}">Copy address</button></div>`);

/* ---------- events ---------- */
const currentRoute=()=>(location.hash.split('/')[1]||'home');
document.addEventListener('click',e=>{
 const row=e.target.closest('[data-go]');if(row&&!e.target.closest('button')){location.hash=row.dataset.go;return}
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='close'){if(e.target===b||b.tagName!=='DIV'){closeModal()}return}
 const act={
  newcall:()=>callModal(b.dataset.t),connect:()=>connectModal(),search:()=>searchModal(),notifs:()=>notifsModal(),settings:()=>settingsModal(),
  disconnect:()=>{S.connected=false;toast('Disconnected');render()},
  me:()=>S.connected?location.hash='#/profile/'+S.me:connectModal(),
  drawer:()=>document.body.classList.toggle('drawer'),
  collapse:()=>document.body.classList.toggle('collapsed'),
  tab:()=>{S.tab=b.dataset.f;render()},tf:()=>{S.tf=b.dataset.f;render()},lb:()=>{S.lb=b.dataset.f;render()},
  pkg:()=>{S.pkg=b.dataset.f;document.querySelectorAll('.pkg').forEach(p=>p.classList.toggle('on',p===b))},
  like:()=>{const k=calls.find(x=>x.id==b.dataset.id);k.liked=!k.liked;k.likes+=k.liked?1:-1;b.classList.toggle('liked',k.liked);b.innerHTML=ic('heart',18,k.liked)+`<span class="num">${k.likes||''}</span>`},
  repost:()=>{const k=calls.find(x=>x.id==b.dataset.id);k.reposted=!k.reposted;k.reposts+=k.reposted?1:-1;b.classList.toggle('reposted',k.reposted);b.querySelector('span').textContent=k.reposts||'';toast(k.reposted?'Reposted':'Repost removed')},
  reply:()=>toast('Replies arrive with the chat phase'),
  share:()=>copy(location.href.split('#')[0]+'#/call/'+b.dataset.id,'Link copied'),
  copy:()=>copy(b.dataset.v,'Address copied'),
  follow:()=>{if(!S.connected)return connectModal();const h=b.dataset.h;S.following.has(h)?S.following.delete(h):S.following.add(h);render()},
  track:()=>{const t=b.dataset.t;S.tracking.has(t)?S.tracking.delete(t):S.tracking.add(t);toast(S.tracking.has(t)?`Tracking $${t}`:`Stopped tracking $${t}`);render()},
  send:()=>sendModal(),receive:()=>receiveModal(),
  flip:()=>{const w=S.swap;[w.from,w.to]=[w.to,w.from];w.amt='';renderSwaps()},
  doswap:()=>{const w=S.swap,x=parseFloat(w.amt),out=usd(w.from,x)*.995/T[w.to].price;S.bal[w.from]-=x;S.bal[w.to]=(S.bal[w.to]||0)+out;
   S.activity.unshift({k:'Swapped',d:`${fmtAmt(x)} ${w.from} for ${fmtAmt(out)} ${w.to}`,t:'Just now'});w.amt='';toast('Swapped');render()},
  shownew:()=>{calls.forEach(k=>k.fresh=false);S.queued.forEach(k=>k.fresh=true);calls=[...S.queued,...calls];S.queued=[];render();scrollTo({top:0})},
  submitpromo:()=>{const n=$('#pn').value.trim(),l=$('#pl').value.trim(),p=$('#pp').value.trim();
   if(!n||!l||p.length<20)return $('#perr').textContent='Add a project name, a CA or website, and at least 20 characters about the project.';
   if(!S.connected)return connectModal();toast('Promotion request sent');location.hash='#/home'},
  theme:()=>{const r=document.documentElement,d=r.dataset.theme&&r.dataset.theme!=='system'?r.dataset.theme:(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.dataset.theme=d==='dark'?'light':'dark'},
  settheme:()=>{const f=b.dataset.f;if(f==='system')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=f;settingsModal()},
  setside:()=>{document.body.classList.toggle('collapsed',b.dataset.f==='closed');settingsModal()}
 }[a];act&&act()});
document.addEventListener('input',e=>{if(e.target.dataset.swap!=='amt')return;S.swap.amt=e.target.value.replace(/[^0-9.]/g,'');
 const all=[...document.querySelectorAll('[data-swap="amt"]')],idx=all.indexOf(e.target),pos=e.target.selectionStart;renderSwaps();
 const i=document.querySelectorAll('[data-swap="amt"]')[idx];if(i){i.focus();try{i.setSelectionRange(pos,pos)}catch(_){}}});
document.addEventListener('change',e=>{const k=e.target.dataset.swap;if(k!=='from'&&k!=='to')return;const w=S.swap,v=e.target.value,o=k==='from'?'to':'from';if(w[o]===v)w[o]=w[k];w[k]=v;renderSwaps()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();document.body.classList.remove('drawer')}});

/* live price ticks: patch numbers in place */
setInterval(()=>{const r=rng(Date.now()%1e6);Object.values(T).forEach(t=>{if(!t.base&&!t.prelaunch)t.price*=1+(r()-.48)*.012});
 calls.forEach(k=>{const p=perf(k);if(p===null)return;const el=document.querySelector(`[data-perf="${k.id}"]`);if(el){el.textContent=fmtPct(p);el.className='num '+(p>=0?'up':'down')}
  const n=document.querySelector(`[data-now="${k.id}"]`);if(n)n.textContent=`${fmtUsd(k.entry)} to ${fmtUsd(mcap(T[k.t]))} MC`});
 document.querySelectorAll('[data-price]').forEach(el=>el.textContent=fmtPrice(T[el.dataset.price].price))},3000);

/* simulated realtime: new calls arrive and wait behind the pill */
setTimeout(()=>{S.queued.push({id:901,c:'zerobeta',t:'KFSH',entry:mcap(T.KFSH)*.98,thesis:'Whale wallets that bought GLORP early are loading KFSH now. Same pattern.',target:40e6,horizon:'7 days',ago:'now',likes:3,reposts:0,replies:0,views:120},
 {id:902,c:'dr_liquidity',t:'DOTB',entry:mcap(T.DOTB)*.95,thesis:'Liquidity just doubled on DOTB. Taking a small position.',target:300e3,horizon:'3 days',ago:'now',likes:1,reposts:0,replies:0,views:44});
 const np=$('#newpill');if(np&&S.tab==='foryou')np.innerHTML=newPill()},12000);

/* static icons */
$('#markIcon').innerHTML=ic('promote',22);$('#setIcon').innerHTML=ic('settings',20);$('#colIcon').innerHTML=ic('chev',20);
$('#menuIcon').innerHTML=ic('menu');$('#fab').innerHTML=ic('plus',28);$('#searchBtn').innerHTML=ic('search',18)+'<span class="lbl">Search</span>';
if(innerWidth>760&&innerWidth<1100)document.body.classList.add('collapsed');
addEventListener('hashchange',()=>{render();scrollTo({top:0})});
render();
</script>
