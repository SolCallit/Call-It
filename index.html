html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
svg{flex:none}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--muted)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:auto minmax(0,1fr)}
.sb{position:sticky;top:0;height:100vh;width:268px;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 14px;overflow-y:auto;overflow-x:hidden;background:var(--bg);transition:width .2s ease,padding .2s ease;scrollbar-width:none}
.sb::-webkit-scrollbar{display:none}
.sb-top{display:flex;align-items:center;gap:10px;padding:2px 4px 14px}
.brand{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:4px;margin:-4px;border-radius:14px;font:800 25px/1 var(--display);letter-spacing:-.03em;color:var(--text)}
.brand:hover{background:var(--hover)}

.brand:active .mark{transform:scale(.94)}
.ib{width:38px;height:38px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--text);position:relative}
.ib:hover{background:var(--hover)}
.sb-top .settings{margin-left:auto}
.searchbtn{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);border-radius:999px;padding:10px 14px;color:var(--muted);background:var(--bg2);margin-bottom:6px;text-align:left}
.grp{font-size:13px;color:var(--muted);padding:14px 12px 4px;border-top:1px solid var(--line);margin-top:8px}
.grp.first{border-top:0;margin-top:0}
.nav a{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:999px;font-size:16px;font-weight:500}
.nav a:hover{background:var(--hover)}
.nav a.on{font-weight:800}
.nav a.on svg{color:var(--hi)}
.sb .grow{flex:1;min-height:16px}
.connect{width:100%}
.acct{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:8px;border-radius:999px;text-align:left}
.acct:hover{background:var(--hover)}
/* icons-only tray (all screen sizes): tap the logo to open or close */
body.collapsed .sb{width:80px;padding:16px 10px;align-items:center}
body.collapsed .lbl,body.collapsed .brand .word,body.collapsed .sb-top .settings{display:none}
body.collapsed .sb-top{padding:2px 0 10px}
body.collapsed .searchbtn{width:48px;height:48px;padding:0;justify-content:center;border-radius:50%}
body.collapsed .grp{font-size:0;padding:6px 0;width:40px;margin-top:8px}
body.collapsed .grp.first{display:none}
body.collapsed .nav a{justify-content:center;padding:12px}
body.collapsed .connect{width:48px;height:48px;padding:0;border-radius:50%}
body.collapsed .acct{justify-content:center;padding:4px}
.main{min-width:0}
.hdr{position:sticky;top:0;z-index:15;height:var(--hdr);display:flex;align-items:center;gap:12px;padding:0 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hdr h1{font:800 22px/1 var(--display);letter-spacing:-.02em;margin:0}
.pill{margin-left:auto;display:flex;align-items:center;gap:2px;border:1.5px solid var(--line);border-radius:999px;padding:3px}
.pill .ib{width:40px;height:40px}
.dotn{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--down);border:2px solid var(--bg)}
.cols{display:grid;grid-template-columns:minmax(0,640px) 330px;gap:28px;padding:0 20px 0 0}
.center{border-right:1px solid var(--line);min-height:calc(100vh - var(--hdr));padding-bottom:120px}
.rail{position:sticky;top:var(--hdr);align-self:start;padding:18px 0;display:flex;flex-direction:column;gap:16px}
@media (max-width:1279px){.cols{grid-template-columns:minmax(0,680px);padding:0}.rail{display:none}}
.fab{position:fixed;right:28px;bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:25;width:62px;height:62px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 10px 30px rgba(11,27,39,.35)}
.fab:hover{transform:scale(1.05)}
.dscrim{display:none}
/* phone: slim icon rail pinned left like X; opening it slides the full tray over the feed */
@media (max-width:760px){
  .shell{display:block}
  .sb{position:fixed;left:0;top:0;bottom:0;height:auto;z-index:45;width:280px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:12px 0 40px rgba(5,13,20,.35)}
  body.collapsed .sb{width:64px;padding-left:8px;padding-right:8px;box-shadow:none}
  body.collapsed .nav a{padding:10px}
  body.collapsed .searchbtn,body.collapsed .connect{width:44px;height:44px}
  body.collapsed .grp{width:32px}
  .main{margin-left:64px}
  body:not(.collapsed) .dscrim{display:block;position:fixed;inset:0;z-index:44;background:rgba(5,13,20,.55)}
  .hdr{padding:0 12px}
  .hdr h1{font-size:20px}
  .pill .ib{width:36px;height:36px}
  .center{border-right:0}
  .fab{bottom:calc(20px + env(safe-area-inset-bottom,0px));right:16px;width:56px;height:56px}
}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:10px 18px;font-weight:700;background:var(--bg2);color:var(--text);white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.block{width:100%}
.btn.sm{padding:6px 14px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.input{width:100%;background:var(--bg2);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
.input:focus{border-color:var(--hi)}
textarea.input{resize:vertical;min-height:96px}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:12.5px;color:var(--down);min-height:4px}
.seg{display:inline-flex;background:var(--bg2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:18px}
.card h3{margin:0 0 12px;font:800 18px/1.2 var(--display)}
.pad{padding:18px 16px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:none}
.av.md{width:46px;height:46px;font-size:15px}
.av.lg{width:96px;height:96px;font-size:30px;border:4px solid var(--bg)}
.tokav{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff;flex:none}
.chain{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--hover);color:var(--hi)}
.h2{font:800 20px/1.2 var(--display);margin:0}

/* ---------- tabs + feed ---------- */
.tabs{position:sticky;top:var(--hdr);z-index:12;display:flex;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:16px 0;font-weight:600;font-size:15.5px;color:var(--muted);position:relative}
.tabs button:hover{background:var(--hover)}
.tabs button.on{color:var(--text);font-weight:800}
.tabs button.on::after{content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:60px;height:4px;border-radius:4px;background:var(--hi)}
.newpill{position:sticky;top:calc(var(--hdr) + 62px);z-index:11;display:flex;justify-content:center;height:0}
.newpill button{margin-top:10px;display:flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--hi);color:#fff;font-weight:700;padding:7px 16px 7px 10px;box-shadow:0 8px 20px rgba(11,27,39,.3);animation:drop .3s ease-out}
.newpill .av{width:26px;height:26px;font-size:10px;border:2px solid var(--hi)}
@keyframes drop{from{transform:translateY(-10px);opacity:0}}
.post{display:grid;grid-template-columns:46px minmax(0,1fr);gap:12px;padding:16px 16px 8px;border-bottom:1px solid var(--line)}
.post:hover{background:color-mix(in srgb,var(--hover) 40%,transparent)}
.post.fresh{animation:flash 1.6s ease-out}
@keyframes flash{from{background:var(--hover)}}
.phead{display:flex;align-items:center;gap:6px;min-width:0}
.pname{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pname:hover{text-decoration:underline}
.rk{font-size:12px;font-weight:800;color:var(--hi);background:var(--hover);padding:1px 7px;border-radius:999px}
.tag{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--accent);color:var(--on-accent)}
.phead time{margin-left:auto;color:var(--muted);font-size:14px;white-space:nowrap}
.ptext{margin:3px 0 10px;font-size:15.5px;overflow-wrap:anywhere}
.ccard{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1.5px solid var(--line);border-radius:18px;padding:12px 14px}
.ccard:hover{border-color:var(--hi)}
.post.fresh .ccard{animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.94);opacity:.3}}
.cn{flex:1;min-width:0}
.cn b{display:block;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cn span{font-size:13px;color:var(--muted)}
.cr{text-align:right}
.cr2{display:flex;gap:18px;text-align:right;flex:none}
.cr2 span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap}

 {id:'solstice',brand:'Solstice Card',h:'solsticecard',ic:'swap',text:'Spend USDC anywhere cards work. No top-ups, no waiting, 2% back in SOL.',title:'Spend crypto like cash',sub:'Solana · Visa debit',cta:'Get the card',g:['#0B9366','#0B1B27']},
 {id:'callit',brand:'Callit',h:'callit',ic:'promote',text:'Put your product in front of every trader on Callit. Ad slots and sponsored calls, always clearly labelled.',title:'Advertise on Callit',sub:'Ad board · Sponsored calls',cta:'Promote',href:'#/promote',g:['#16314A','#0B1B27']}
];

 bal:{SOL:4.2,USDC:310,GLORP:120000},activity:[{k:'Received',d:'2 SOL',t:'Yesterday'}],

/* ---------- helpers ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}
function copy(txt,msg='Copied'){navigator.clipboard?.writeText(txt).catch(()=>{});toast(msg)}
const perf=k=>{const t=T[k.t];return t.prelaunch?null:(mcap(t)/k.entry-1)*100};
function chart(seed,up,w=600,h=190){const r=rng(seed);let y=up?.25:.75,p=[];for(let i=0;i<72;i++){y+=(r()-.5)*.11+(up?.008:-.008);y=Math.min(.95,Math.max(.05,y));p.push(y)}
 const d=p.map((v,i)=>`${i?'L':'M'}${(i/71*w).toFixed(1)},${(h-v*h).toFixed(1)}`).join('');
 return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="chart" role="img" aria-label="Price chart"><path d="${d}L${w},${h}L0,${h}Z" class="area ${up?'up':'down'}"/><path d="${d}" class="line ${up?'up':'down'}"/></svg>`}
function qr(seed){const r=rng(seed),n=21,c=9;let o='';const f=(x,y)=>(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){const on=f(x,y)?((x%14===0||x%14===6||y%14===0||y%14===6)||(x%14>1&&x%14<5&&y%14>1&&y%14<5)):r()>.5;if(on)o+=`<rect x="${x*c}" y="${y*c}" width="${c}" height="${c}"/>`}
 return `<svg viewBox="0 0 ${n*c} ${n*c}" width="180" height="180" style="background:#fff;padding:10px;border-radius:14px" fill="#0B1B27">${o}</svg>`}
const ranked=()=>Object.values(C).filter(c=>c.calls>=10).sort((a,b)=>b.win-a.win||b.avg-a.avg);
const rankOf=h=>{const i=ranked().findIndex(c=>c.h===h);return i<0?null:i+1};
const usd=(s,a)=>T[s].price*a;
const tradable=t=>t.chain==='Solana'&&!t.prelaunch;

/* ---------- post (X layout + pump call card) ---------- */
const money=n=>(n>=0?'+':'−')+fmtUsd(Math.abs(n));
function nums(k){const t=T[k.t];if(t.prelaunch)return null;const mc=mcap(t),x=mc/k.entry,o={mc,p:(x-1)*100,up:x>=1};if(k.buy){o.pos=k.buy*x;o.pnl=o.pos-k.buy}return o}
function mkt(k){const n=nums(k);
 return k.buy?`<div class="cr2 num"><div><span>Position</span><b data-pos="${k.id}">${fmtUsd(n.pos)}</b></div><div><span>Profit</span><b class="${n.pnl>=0?'up':'down'}" data-pnl="${k.id}">${money(n.pnl)}</b></div></div>`
  :`<div class="cr2 num"><div><span>Called at</span><b>${fmtUsd(k.entry)}</b></div><div><span>Since call</span><b class="${n.up?'up':'down'}" data-perf="${k.id}">${fmtPct(n.p)}</b></div></div>`}
function post(k){const t=T[k.t],p=perf(k),r=rankOf(k.c);
 const right=p===null?`<div class="cr"><b>Soon</b><span>Launches ${esc(t.prelaunch)}</span></div>`:mkt(k);
 return `<article class="post${k.fresh?' fresh':''}">
 <a href="#/profile/${k.c}" aria-label="@${esc(k.c)}">${avatar(k.c,'md')}</a>
 <div style="min-width:0">
  <div class="phead"><a class="pname" href="#/profile/${k.c}">${esc(k.c)}</a>${r&&!k.sponsored?`<span class="rk">#${r}</span>`:''}${k.sponsored?'<span class="tag">Sponsored</span>':''}<time>${k.ago==='now'?'now':k.ago+' ago'}</time></div>
  <p class="ptext">${esc(k.thesis)}</p>
  <a class="ccard" href="#/token/${t.sym}">${tokav(t.sym)}<div class="cn"><b>${esc(t.name)}</b><span>$${t.sym} <span class="chain">${t.chain}</span></span></div>${right}</a>
  ${k.sponsored?`<div class="pnote">Paid promotion by ${esc(k.sponsor)}. Not counted in rankings.</div>`:`<div class="pnote">${k.target?`Target ${fmtUsd(k.target)} within ${esc(k.horizon)} · `:''}${k.buy?`<span class="bk">${ic('check',13)} Bought in</span>`:`<span class="bk no">No buy · earns no fees</span>`}</div>`}
  <div class="pbar"><div class="icons">
   <button class="act" data-act="reply" aria-label="Reply">${ic('reply',18)}<span class="num">${k.replies||''}</span></button>
   <button class="act${k.reposted?' reposted':''}" data-act="repost" data-id="${k.id}" aria-label="Repost">${ic('repost',18)}<span class="num">${k.reposts||''}</span></button>
   <button class="act${k.liked?' liked':''}" data-act="like" data-id="${k.id}" aria-label="Like">${ic('heart',18,k.liked)}<span class="num">${k.likes||''}</span></button>
   <span class="act views" aria-label="Views">${ic('views',18)}<span class="num">${fmtK(k.views||0)}</span></span>
   <button class="act" data-act="share" data-id="${k.id}" aria-label="Share">${ic('share',18)}</button></div>
   ${p===null?'':`<a class="mc num ${nums(k).up?'up':'down'}" href="#/token/${t.sym}" data-mc="${k.id}" title="Trade $${t.sym}">${fmtUsd(mcap(t))}<small>MC</small></a>`}
  </div></div></article>`}

/* ---------- ads ---------- */
const adMedia=a=>`<div class="admedia" style="background:linear-gradient(135deg,${a.g[0]},${a.g[1]})"><b>${esc(a.title)}</b>${ic(a.ic,40)}</div>`;
function adPost(a){return `<article class="post">
 <span class="av md" style="background:${a.g[0]}">${esc(a.brand.slice(0,2).toUpperCase())}</span>
 <div style="min-width:0"><div class="phead"><span class="pname">${esc(a.brand)}</span><span class="hint">@${esc(a.h)}</span><span class="tag">Ad</span></div>
 <p class="ptext">${esc(a.text)}</p>
 <div class="adcard" data-act="adclick" data-id="${a.id}">${adMedia(a)}<div class="adfoot"><div><b>${esc(a.title)}</b><span>${esc(a.sub)}</span></div><button class="btn sm primary" data-act="adclick" data-id="${a.id}">${esc(a.cta)}</button></div></div>
 <div class="pnote">Promoted. Not a call and not counted in rankings.</div></div></article>`}
function withAds(list){let out='',n=0;list.forEach((k,i)=>{out+=post(k);if((i+1)%AD_EVERY===0&&i<list.length-1)out+=adPost(ADS[(S.adRot+n++)%ADS.length])});return out}
function adBoard(){const a=ADS[S.board%ADS.length];
 return `<div class="card adboard" id="adboard"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="margin:0">Ad board</h3><span class="adlbl">Promoted</span></div>
 <div class="adslide adcard" data-act="adclick" data-id="${a.id}">${adMedia(a)}<div class="adfoot"><div><b>${esc(a.brand)}</b><span>${esc(a.sub)}</span></div><button class="btn sm primary" data-act="adclick" data-id="${a.id}">${esc(a.cta)}</button></div></div>
 <div class="dots">${ADS.map((_,i)=>`<button class="${i===S.board%ADS.length?'on':''}" data-act="adgo" data-f="${i}" aria-label="Show ad ${i+1}"></button>`).join('')}</div></div>`}

/* ---------- swap widget ---------- */
function swapHTML(){const w=S.swap,f=T[w.from],t=T[w.to],a=parseFloat(w.amt)||0,out=a?usd(w.from,a)*.995/t.price:0;
 const opts=sel=>Object.values(T).filter(tradable).map(x=>`<option ${x.sym===sel?'selected':''}>${x.sym}</option>`).join('');
 let label='Swap',dis=false;
 if(!S.connected)label='Connect wallet';else if(!a){label='Enter an amount';dis=true}else if(a>(S.bal[w.from]||0)){label=`Not enough ${w.from}`;dis=true}
 return `<div class="swap"><div class="box"><div class="row"><span class="hint">You pay</span><span class="hint num">Balance ${fmtAmt(S.bal[w.from]||0)}</span></div>
  <div class="row"><input class="amt num" inputmode="decimal" placeholder="0" value="${esc(w.amt)}" data-swap="amt" aria-label="Amount to pay"><select data-swap="from" aria-label="Pay token">${opts(w.from)}</select></div>
  <div class="hint num">${a?fmtUsd(usd(w.from,a)):'$0'}</div></div>
  <button class="flip" data-act="flip" aria-label="Flip tokens">${ic('swap',16)}</button>
  <div class="box"><div class="row"><span class="hint">You get</span><span class="hint num">Balance ${fmtAmt(S.bal[w.to]||0)}</span></div>
  <div class="row"><div class="amt num">${out?fmtAmt(out):'0'}</div><select data-swap="to" aria-label="Receive token">${opts(w.to)}</select></div></div>
  <div class="lines num"><div><span>Rate</span><span>1 ${f.sym} = ${fmtAmt(f.price/t.price)} ${t.sym}</span></div><div><span>Callit fee</span><span>0.5% (placeholder)</span></div><div><span>Max slippage</span><span>1%</span></div><div><span>Route</span><span>Jupiter</span></div></div>
  <button class="btn primary block" data-act="${S.connected?'doswap':'connect'}" ${dis?'disabled':''}>${label}</button></div>`}
const renderSwaps=()=>document.querySelectorAll('[data-swapbox]').forEach(el=>el.innerHTML=swapHTML());

 if(S.tab==='following'){list=calls.filter(k=>S.following.has(k.c));
  empty=`<div class="pad"><div class="empty" style="padding:28px 12px 8px"><b class="h2">Follow callers you trust</b><p>Their calls land here the moment they post.</p></div>
  ${ranked().slice(0,4).map(c=>`<div class="sugg">${avatar(c.h,'md')}<div class="grow"><a class="pname" href="#/profile/${c.h}">${c.h}</a><div class="hint">${c.win}% win rate over ${c.calls} calls</div></div><button class="btn sm primary" data-act="follow" data-h="${c.h}">Follow</button></div>`).join('')}</div>`}

 return `<div class="tabs" role="tablist">${[['foryou','For you'],['following','Following'],['watchlist','Watchlist']].map(([k,l])=>`<button role="tab" aria-selected="${S.tab===k}" class="${S.tab===k?'on':''}" data-act="tab" data-f="${k}">${l}</button>`).join('')}</div>

 ${rows.map(t=>`<tr data-go="#/token/${t.sym}"><td><div class="person">${tokav(t.sym)}<div>${esc(t.name)}<div class="hint">$${t.sym} <span class="chain">${t.chain}</span></div></div></div></td>

 <td><button class="ib" data-act="track" data-t="${t.sym}" aria-label="Add ${t.sym} to watchlist" style="color:${S.watch.has(t.sym)?'var(--hi)':'var(--muted)'}">${ic('star',20,S.watch.has(t.sym))}</button></td></tr>`).join('')}</tbody></table></div>`}

 const head=`<div class="pad" style="padding-bottom:0"><div style="display:flex;align-items:center;gap:12px">${tokav(t.sym)}<div style="flex:1;min-width:0"><b class="h2">${esc(t.name)}</b> <span class="muted">$${t.sym}</span><div><span class="chain">${t.chain}</span> <button class="copyca" data-act="copy" data-v="${esc(t.ca)}">${short(t.ca)} ${ic('copy',13)}</button></div></div>
 <button class="btn sm ${tr?'primary':'ghost'}" data-act="track" data-t="${sym}">${ic('star',15,tr)} ${tr?'On watchlist':'Watchlist'}</button></div>`;
 if(t.prelaunch)return head+`<div class="card" style="margin-top:16px">Launches ${esc(t.prelaunch)}. Trading opens after launch.${t.chain!=='Solana'?` In-app trading for ${t.chain} tokens isn't available yet.`:''}</div></div><div id="feed" style="margin-top:12px;border-top:1px solid var(--line)">${on.map(post).join('')}</div>`;

 ${chart(t.seed*7+S.tf.charCodeAt(1)*3,up)}

 ${tradable(t)?`<div class="card"><h3>Trade $${t.sym}</h3><div data-swapbox></div></div>`:`<div class="card">In-app trading for ${t.chain} tokens isn't available yet. You can still call it and add it to your watchlist.</div>`}
 <div style="display:flex;justify-content:space-between;align-items:center;margin:22px 0 4px"><b class="h2">Calls on $${t.sym}</b><button class="btn sm primary" data-act="newcall" data-t="${sym}">Call it</button></div></div>

 <div class="seg">${['7d','30d','All time'].map(x=>`<button class="${S.lb===x?'on':''}" data-act="lb" data-f="${x}">${x}</button>`).join('')}</div></div>

 <div class="field"><label>Package</label><div class="pkgs">${Object.entries(PK).map(([k,[a,b]])=>`<button class="pkg ${S.pkg===k?'on':''}" data-act="pkg" data-f="${k}" style="text-align:left"><b>${a}</b><p>${b}</p><p style="margin-top:8px">Pricing set before launch</p></button>`).join('')}</div></div>
 <div id="perr" class="err"></div><button class="btn primary" data-act="submitpromo">Send promotion request</button></div>`}

function vAbout(){return `<div class="prose"><b class="h2" style="display:block;margin-bottom:12px">Call it early. Get paid for being right.</b>
 <p>Callit is where crypto calls get tracked. Every call is stamped with the market cap at the moment it's posted, then followed live, so a caller's record is public and can't be edited.</p>
 <p>Callers earn a share of fees when people trade through their calls, but only on calls they bought into with their own wallet. Skin in the game, visible on every call as position and profit. Projects on any chain can promote launches through top callers, always labelled as sponsored.</p>
 <p>Wallets are non-custodial. Sign in with email, Google or X, or bring Phantom, Solflare or Backpack.</p></div>`}

/* ---------- rail ---------- */
function rail(){return adBoard()+railRest()}
function railRest(){const trend=Object.values(T).filter(t=>!t.base&&!t.prelaunch).sort((a,b)=>b.chg-a.chg).slice(0,4);
 return `<div class="card"><h3>Trending</h3><div class="list">${trend.map(t=>`<a class="li" href="#/token/${t.sym}">${tokav(t.sym)}<div class="grow"><b>$${t.sym}</b><div class="hint">${(n=>n+(n===1?' call':' calls'))(calls.filter(k=>k.t===t.sym).length)}</div></div><div class="r num"><b>${fmtUsd(mcap(t))}</b><div class="hint ${t.chg>=0?'up':'down'}">${fmtPct(t.chg)}</div></div></a>`).join('')}</div></div>
 <div class="card"><h3>Top callers</h3><div class="list">${ranked().slice(0,4).map(c=>`<div class="li">${avatar(c.h)}<div class="grow"><a class="pname" href="#/profile/${c.h}">${c.h}</a><div class="hint">${c.win}% win rate</div></div><button class="btn sm ${S.following.has(c.h)?'ghost':'primary'}" data-act="follow" data-h="${c.h}">${S.following.has(c.h)?'Following':'Follow'}</button></div>`).join('')}</div>
 <a class="btn ghost block" style="margin-top:10px" href="#/leaderboard">See leaderboard</a></div>`}

/* ---------- chrome ---------- */
const NAV_A=[['home','Home'],['market','Market'],['trenches','Trenches'],['swap','Swap'],['stake','Stake'],['wallet','Wallet'],['profile','Profile']];
const NAV_B=[['leaderboard','Leaderboard'],['messages','Messages'],['news','News'],['promote','Promote'],['about','About']];
const TITLES=Object.fromEntries([...NAV_A,...NAV_B,['token','Token']]);
function chrome(route){const link=([k,l])=>`<a href="#/${k}" class="${route===k?'on':''}" title="${l}">${ic(k)}<span class="lbl">${l}</span></a>`;
 $('#navA').innerHTML=NAV_A.map(link).join('');$('#navB').innerHTML=NAV_B.map(link).join('');
 $('#acct').innerHTML=S.connected?`<button class="acct" data-act="disconnect" title="Disconnect">${avatar(S.me)}<span class="lbl" style="min-width:0"><b style="display:block">${esc(S.me)}</b><span class="hint num">${short(S.addr)}</span></span></button>`
  :`<button class="btn primary connect" data-act="connect" title="Connect wallet">${ic('wallet',20)}<span class="lbl">Connect wallet</span></button>`;
 $('#pill').innerHTML=`<button class="ib" data-act="me" aria-label="Profile">${S.connected?avatar(S.me).replace('class="av ','class="av " style="width:32px;height:32px;font-size:11px;'):ic('profile')}</button>
  <button class="ib" data-act="notifs" aria-label="Notifications">${ic('bell')}${S.unread?'<span class="dotn"></span>':''}</button>
  <button class="ib" data-act="theme" aria-label="Switch theme">${ic('sun')}</button>`;
 syncTray();
 $('#title').textContent=TITLES[route]||'Home'}

const isPhone=()=>matchMedia('(max-width:760px)').matches;
function syncTray(){const open=!document.body.classList.contains('collapsed'),b=$('#brand');b.setAttribute('aria-expanded',open);b.setAttribute('aria-label',open?'Close menu':'Open menu')}
function render(){if(isPhone())document.body.classList.add('collapsed');const [,r0='home',p]=location.hash.split('/');const r=r0||'home';let html;
 if(r==='token'){const t=T[p];if(t&&tradable(t)&&p!==S.swap.from)S.swap.to=p;html=vToken(p)}
 else html=({market:vMarket,trenches:vTrenches,swap:vSwap,wallet:vWallet,profile:()=>vProfile(p),leaderboard:vLeaders,promote:vPromote,about:vAbout,
  stake:()=>soon('Staking opens with $CALLIT','Stake $CALLIT to unlock premium calls and discounted project promotions. Launching after the product is live on mainnet.'),
  messages:()=>soon('Messages are coming','Direct messages and token chat rooms arrive in the chat phase.'),
  news:()=>soon('News is coming','Launch announcements, listings and market news in one place.')}[r]||vHome)();
 $('#view').innerHTML=html;$('#rail').innerHTML=rail();chrome(r);renderSwaps()}

/* ---------- modals ---------- */
function modal(title,sub,body,onMount){$('#modal').innerHTML=`<div class="scrim" data-act="close"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="mhead"><div><h2>${title}</h2>${sub?`<p class="sub">${sub}</p>`:''}</div><button class="ib" data-act="close" aria-label="Close">${ic('x',18)}</button></div>${body}</div></div>`;
 onMount&&onMount($('#modal .modal'));const f=$('#modal input,#modal textarea');f&&f.focus()}
const closeModal=()=>$('#modal').innerHTML='';

function connectModal(next){modal('Sign in to Callit','New here? We create a Solana wallet for you. You own the keys.',
 `${['Email','Google','X'].map(l=>`<button class="opt" data-connect="${l}"><span class="tokav" style="background:var(--hi)">${l[0]}</span>Continue with ${l}</button>`).join('')}
 <div class="divider">or use your own wallet</div>${['Phantom','Solflare','Backpack'].map(w=>`<button class="opt" data-connect="${w}">${tokav(w)}${w}</button>`).join('')}`,
 m=>m.addEventListener('click',e=>{const b=e.target.closest('[data-connect]');if(!b)return;
  S.connected=true;S.addr='CaLL'+Math.random().toString(36).slice(2,10)+'x9Qp2HkWm4Tz7VbN1sRdE3';S.me='caller_'+S.addr.slice(4,8);
  C[S.me]={h:S.me,win:0,avg:0,calls:0,best:0,followers:0};closeModal();
  toast(['Phantom','Solflare','Backpack'].includes(b.dataset.connect)?`${b.dataset.connect} connected`:'Wallet created');render();next&&next()}))}

function callModal(pre){if(!S.connected)return connectModal(()=>callModal(pre));
 modal('Make a call','Buy in and call it. Your entry is stamped at the live market cap when you post.',
 `<div class="field"><label for="ct">Token</label><input id="ct" class="input" placeholder="Paste a contract address or ticker" value="${pre?'$'+pre:''}"></div><div id="cprev"></div><div id="cbuy"></div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="field"><label for="cg">Target market cap</label><input id="cg" class="input num" inputmode="decimal" placeholder="e.g. 5M"></div>
 <div class="field"><label for="ch">Time window</label><select id="ch" class="input">${['24 hours','3 days','7 days','30 days'].map(x=>`<option ${x==='7 days'?'selected':''}>${x}</option>`).join('')}</select></div></div>
 <div class="field"><label for="cx">Why this token?</label><textarea id="cx" class="input" maxlength="280" placeholder="Your thesis. What do you see that others don't?"></textarea><span class="hint" id="cn">0 / 280</span></div>
 <div class="err" id="cerr"></div><button class="btn primary block" id="cpost" disabled>Post call</button>`,
 m=>{let tok=null,sol='0.25',skip=false;const inp=$('#ct',m),tx=$('#cx',m),post=$('#cpost',m);
  const canBuy=()=>tok&&tradable(tok);
  const buyOn=()=>canBuy()&&!skip;
  const drawBuy=()=>{const el=$('#cbuy',m);if(!tok||tok.prelaunch){el.innerHTML='';return}
   if(!canBuy()){el.innerHTML=`<div class="buybox"><b>No buy for this one</b><p class="hint" style="margin:4px 0 0">In-app buys for ${tok.chain} tokens aren't live yet. You can still call it, but it won't earn caller fees.</p></div>`;return}
   const a=parseFloat(sol)||0,usdV=a*T.SOL.price,got=usdV*.995/tok.price;
   el.innerHTML=`<div class="buybox"><div class="top"><b>Buy $${tok.sym}</b><span class="hint num" style="white-space:nowrap">Balance ${fmtAmt(S.bal.SOL)} SOL</span></div>
   ${skip?'':`<div class="presets">${['0.1','0.25','0.5','1'].map(v=>`<button type="button" data-sol="${v}" class="${sol===v?'on':''}">${v} SOL</button>`).join('')}</div>
   <label class="solin"><input id="csol" class="num" inputmode="decimal" value="${esc(sol)}" aria-label="SOL to spend"><span class="muted">SOL</span></label>
   <div class="hint num" style="margin-top:8px">${a?`≈ ${fmtUsd(usdV)} · you get ~${fmtAmt(got)} $${tok.sym} · via Jupiter`:'Enter an amount'}</div>`}
   <label class="skip"><input type="checkbox" id="cskip" ${skip?'checked':''}> Call without buying (won't earn caller fees)</label></div>`;
   const si=$('#csol',el);if(si)si.addEventListener('input',()=>{sol=si.value.replace(/[^0-9.]/g,'');const pos=si.selectionStart;drawBuy();const n=$('#csol',m);n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}check()});
   el.querySelectorAll('[data-sol]').forEach(b=>b.onclick=()=>{sol=b.dataset.sol;drawBuy();check()});
   $('#cskip',el).onchange=e=>{skip=e.target.checked;drawBuy();check()}};
  const check=()=>{$('#cn',m).textContent=tx.value.length+' / 280';post.textContent=buyOn()?`Buy ${parseFloat(sol)||0} SOL & post call`:'Post call';post.disabled=!(tok&&!tok.prelaunch&&tx.value.trim().length>=10&&(!buyOn()||parseFloat(sol)>0))};
  const find=()=>{const v=inp.value.trim().replace(/^\$/,'').toUpperCase();tok=Object.values(T).find(t=>!t.base&&(t.sym===v||t.ca.toUpperCase()===v))||null;
   $('#cprev',m).innerHTML=tok?`<div class="preview">${tokav(tok.sym)}<div style="flex:1"><b>${esc(tok.name)} $${tok.sym}</b> <span class="chain">${tok.chain}</span><div class="hint num">${tok.prelaunch?'Launches '+esc(tok.prelaunch)+'. Calls open at launch.':'Entry would be '+fmtUsd(mcap(tok))+' MC'}</div></div></div>`:(v?'<p class="hint" style="margin-top:-6px">No token found. Try GLORP, DOTB, MOTH, KFSH or ORBIT in this prototype.</p>':'');drawBuy();check()};
  inp.addEventListener('input',find);tx.addEventListener('input',check);find();
  post.addEventListener('click',()=>{const g=$('#cg',m).value.trim().toUpperCase(),n=parseFloat(g)*(g.endsWith('B')?1e9:g.endsWith('M')?1e6:g.endsWith('K')?1e3:1);
   if(g&&!(n>mcap(tok))){$('#cerr',m).textContent='Target must be above the current market cap of '+fmtUsd(mcap(tok))+'.';return}
   let buy=0;if(buyOn()){const a=parseFloat(sol);if(a>S.bal.SOL){$('#cerr',m).textContent=`You only have ${fmtAmt(S.bal.SOL)} SOL. Lower the amount or deposit more.`;return}
    buy=a*T.SOL.price;const got=buy*.995/tok.price;S.bal.SOL-=a;S.bal[tok.sym]=(S.bal[tok.sym]||0)+got;S.activity.unshift({k:'Bought',d:`${fmtAmt(got)} ${tok.sym} for ${a} SOL`,t:'Just now'})}
   calls.forEach(k=>k.fresh=false);calls.unshift({id:Date.now(),c:S.me,t:tok.sym,entry:mcap(tok),buy,thesis:tx.value.trim(),target:n||null,horizon:$('#ch',m).value,ago:'now',likes:0,reposts:0,replies:0,views:1,fresh:true});
   C[S.me].calls++;closeModal();S.tab='foryou';if(location.hash!=='#/home')location.hash='#/home';else render();toast(buy?'Bought in and call posted':'Call posted');scrollTo({top:0})})})}

function searchModal(){modal('Search','',`<input class="input" id="sq" placeholder="Search tokens, tickers or callers"><div class="list" id="sres" style="margin-top:8px"></div>`,
 m=>{const run=()=>{const q=$('#sq',m).value.trim().toLowerCase().replace(/^[$@]/,'');
  const toks=Object.values(T).filter(t=>!t.base&&(!q||t.sym.toLowerCase().includes(q)||t.name.toLowerCase().includes(q))).slice(0,5);
  const ppl=Object.values(C).filter(c=>!q||c.h.includes(q)).slice(0,4);
  $('#sres',m).innerHTML=toks.map(t=>`<a class="li" href="#/token/${t.sym}" data-act="close">${tokav(t.sym)}<div class="grow"><b>${esc(t.name)}</b><div class="hint">$${t.sym} on ${t.chain}</div></div></a>`).join('')+ppl.map(c=>`<a class="li" href="#/profile/${c.h}" data-act="close">${avatar(c.h)}<div class="grow"><b>${c.h}</b><div class="hint">${c.calls} calls, ${c.win}% win rate</div></div></a>`).join('')||'<p class="hint">Nothing matches that. Try a ticker like GLORP.</p>'};
  $('#sq',m).addEventListener('input',run);run()})}
function notifsModal(){S.unread=false;chrome(currentRoute());modal('Notifications','',`<div class="list">
 ${[['fadedpixel','posted a call on $GLORP','2h'],['lagosape','is promoting the Nebula launch','3h'],['minnie_sol','called $DOTB, now up big','4h']].map(([h,t,a])=>`<a class="li" href="#/profile/${h}" data-act="close">${avatar(h)}<div class="grow"><b>${h}</b> ${t}<div class="hint">${a} ago</div></div></a>`).join('')}</div>`)}
function settingsModal(){const th=document.documentElement.dataset.theme||'system',col=document.body.classList.contains('collapsed');
 modal('Settings','',`<div class="field"><label>Theme</label><div class="seg">${[['system','System'],['dark','Navy'],['light','White']].map(([k,l])=>`<button class="${th===k?'on':''}" data-act="settheme" data-f="${k}">${l}</button>`).join('')}</div></div>
 <div class="field"><label>Sidebar</label><div class="seg"><button class="${col?'':'on'}" data-act="setside" data-f="open">Expanded</button><button class="${col?'on':''}" data-act="setside" data-f="closed">Icons only</button></div></div>`)}
function sendModal(){modal('Send','Send tokens to any Solana address.',
 `<div class="field"><label for="st">Token</label><select id="st" class="input">${Object.keys(S.bal).filter(k=>S.bal[k]>0).map(k=>`<option value="${k}">${k} (${fmtAmt(S.bal[k])})</option>`).join('')}</select></div>
 <div class="field"><label for="sa">Recipient address</label><input id="sa" class="input" placeholder="Solana address"></div>
 <div class="field"><label for="sv">Amount</label><div style="display:flex;gap:8px"><input id="sv" class="input num" inputmode="decimal" placeholder="0"><button class="btn" id="smax">Max</button></div></div>
 <div class="err" id="serr"></div><button class="btn primary block" id="sgo">Send</button>`,
 m=>{$('#smax',m).onclick=()=>$('#sv',m).value=S.bal[$('#st',m).value];
  $('#sgo',m).onclick=()=>{const k=$('#st',m).value,to=$('#sa',m).value.trim(),a=parseFloat($('#sv',m).value),e=$('#serr',m);
   if(!/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(to))return e.textContent='That isn’t a valid Solana address. Check it and try again.';
   if(!(a>0))return e.textContent='Enter an amount above zero.';
   if(a>S.bal[k])return e.textContent=`You only have ${fmtAmt(S.bal[k])} ${k}.`;
   S.bal[k]-=a;S.activity.unshift({k:'Sent',d:`${fmtAmt(a)} ${k} to ${short(to)}`,t:'Just now'});closeModal();render();toast('Sent')}})}
const receiveModal=()=>modal('Receive','Send SOL or any Solana token to this address.',`<div style="text-align:center">${qr(hue(S.addr))}<p class="num" style="overflow-wrap:anywhere;font-size:13px">${S.addr}</p><button class="btn primary block" data-act="copy" data-v="${S.addr}">Copy address</button></div>`);

/* ---------- events ---------- */
const currentRoute=()=>(location.hash.split('/')[1]||'home');
document.addEventListener('click',e=>{
 const row=e.target.closest('[data-go]');if(row&&!e.target.closest('button')){location.hash=row.dataset.go;return}
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='close'){if(e.target===b||b.tagName!=='DIV'){closeModal()}return}
 const act={
  newcall:()=>callModal(b.dataset.t),connect:()=>connectModal(),search:()=>searchModal(),notifs:()=>notifsModal(),settings:()=>settingsModal(),
  disconnect:()=>{S.connected=false;toast('Disconnected');render()},
  me:()=>S.connected?location.hash='#/profile/'+S.me:connectModal(),
  collapse:()=>{document.body.classList.toggle('collapsed');syncTray()},
  adclick:()=>{const a=ADS.find(x=>x.id===b.dataset.id);if(a.href)location.hash=a.href;else toast(`Opens ${a.brand} in a new tab once ads go live`)},
  adgo:()=>{S.board=+b.dataset.f;const el=$('#adboard');if(el)el.outerHTML=adBoard()},
  tab:()=>{S.tab=b.dataset.f;render()},tf:()=>{S.tf=b.dataset.f;render()},lb:()=>{S.lb=b.dataset.f;render()},
  pkg:()=>{S.pkg=b.dataset.f;document.querySelectorAll('.pkg').forEach(p=>p.classList.toggle('on',p===b))},
  like:()=>{const k=calls.find(x=>x.id==b.dataset.id);k.liked=!k.liked;k.likes+=k.liked?1:-1;b.classList.toggle('liked',k.liked);b.innerHTML=ic('heart',18,k.liked)+`<span class="num">${k.likes||''}</span>`},
  repost:()=>{const k=calls.find(x=>x.id==b.dataset.id);k.reposted=!k.reposted;k.reposts+=k.reposted?1:-1;b.classList.toggle('reposted',k.reposted);b.querySelector('span').textContent=k.reposts||'';toast(k.reposted?'Reposted':'Repost removed')},
  reply:()=>toast('Replies arrive with the chat phase'),
  share:()=>copy(location.href.split('#')[0]+'#/call/'+b.dataset.id,'Link copied'),
  copy:()=>copy(b.dataset.v,'Address copied'),
  follow:()=>{if(!S.connected)return connectModal();const h=b.dataset.h;S.following.has(h)?S.following.delete(h):S.following.add(h);render()},
  track:()=>{const t=b.dataset.t;S.watch.has(t)?S.watch.delete(t):S.watch.add(t);toast(S.watch.has(t)?`$${t} added to watchlist`:`$${t} removed from watchlist`);render()},
  send:()=>sendModal(),receive:()=>receiveModal(),
  flip:()=>{const w=S.swap;[w.from,w.to]=[w.to,w.from];w.amt='';renderSwaps()},
  doswap:()=>{const w=S.swap,x=parseFloat(w.amt),out=usd(w.from,x)*.995/T[w.to].price;S.bal[w.from]-=x;S.bal[w.to]=(S.bal[w.to]||0)+out;
   S.activity.unshift({k:'Swapped',d:`${fmtAmt(x)} ${w.from} for ${fmtAmt(out)} ${w.to}`,t:'Just now'});w.amt='';toast('Swapped');render()},
  shownew:()=>{calls.forEach(k=>k.fresh=false);S.queued.forEach(k=>k.fresh=true);calls=[...S.queued,...calls];S.queued=[];render();scrollTo({top:0})},
  submitpromo:()=>{const n=$('#pn').value.trim(),l=$('#pl').value.trim(),p=$('#pp').value.trim();
   if(!n||!l||p.length<20)return $('#perr').textContent='Add a project name, a CA or website, and at least 20 characters about the project.';
   if(!S.connected)return connectModal();toast('Promotion request sent');location.hash='#/home'},
  theme:()=>{const r=document.documentElement,d=r.dataset.theme&&r.dataset.theme!=='system'?r.dataset.theme:(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.dataset.theme=d==='dark'?'light':'dark'},
  settheme:()=>{const f=b.dataset.f;if(f==='system')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=f;settingsModal()},
  setside:()=>{document.body.classList.toggle('collapsed',b.dataset.f==='closed');syncTray();settingsModal()}
 }[a];act&&act()});
document.addEventListener('input',e=>{if(e.target.dataset.swap!=='amt')return;S.swap.amt=e.target.value.replace(/[^0-9.]/g,'');
 const all=[...document.querySelectorAll('[data-swap="amt"]')],idx=all.indexOf(e.target),pos=e.target.selectionStart;renderSwaps();
 const i=document.querySelectorAll('[data-swap="amt"]')[idx];if(i){i.focus();try{i.setSelectionRange(pos,pos)}catch(_){}}});
document.addEventListener('change',e=>{const k=e.target.dataset.swap;if(k!=='from'&&k!=='to')return;const w=S.swap,v=e.target.value,o=k==='from'?'to':'from';if(w[o]===v)w[o]=w[k];w[k]=v;renderSwaps()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();if(isPhone()){document.body.classList.add('collapsed');syncTray()}}});

/* live price ticks: patch numbers in place */
setInterval(()=>{const r=rng(Date.now()%1e6);Object.values(T).forEach(t=>{if(!t.base&&!t.prelaunch)t.price*=1+(r()-.48)*.012});
 calls.forEach(k=>{const n=nums(k);if(!n)return;const q=a=>document.querySelector(`[data-${a}="${k.id}"]`);
  let el=q('perf');if(el){el.textContent=fmtPct(n.p);el.className=n.up?'up':'down'}
  el=q('pos');if(el)el.textContent=fmtUsd(n.pos);
  el=q('pnl');if(el){el.textContent=money(n.pnl);el.className=n.pnl>=0?'up':'down'}
  el=q('mc');if(el){el.innerHTML=`${fmtUsd(n.mc)}<small>MC</small>`;el.classList.toggle('up',n.up);el.classList.toggle('down',!n.up)}});
 document.querySelectorAll('[data-price]').forEach(el=>el.textContent=fmtPrice(T[el.dataset.price].price))},3000);

/* simulated realtime: new calls arrive and wait behind the pill */
setTimeout(()=>{S.queued.push({id:901,c:'zerobeta',t:'KFSH',entry:mcap(T.KFSH)*.98,buy:220,thesis:'Whale wallets that bought GLORP early are loading KFSH now. Same pattern.',target:40e6,horizon:'7 days',ago:'now',likes:3,reposts:0,replies:0,views:120},
 {id:902,c:'dr_liquidity',t:'DOTB',entry:mcap(T.DOTB)*.95,buy:35,thesis:'Liquidity just doubled on DOTB. Taking a small position.',target:300e3,horizon:'3 days',ago:'now',likes:1,reposts:0,replies:0,views:44});
 const np=$('#newpill');if(np&&S.tab==='foryou')np.innerHTML=newPill()},12000);

/* static icons */
$('#setIcon').innerHTML=ic('settings',20);$('#fab').innerHTML=ic('plus',28);$('#searchBtn').innerHTML=ic('search',18)+'<span class="lbl">Search</span>';
if(innerWidth<1100)document.body.classList.add('collapsed');
addEventListener('hashchange',()=>{if(currentRoute()==='home')S.adRot++;render();scrollTo({top:0})});
/* ad board rotates on its own */
setInterval(()=>{const el=$('#adboard');if(!el||el.matches(':hover'))return;S.board++;el.outerHTML=adBoard()},6000);
render();
</script>
</body>
</html>
